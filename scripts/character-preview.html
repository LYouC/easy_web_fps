<!doctype html><html lang="zh"><meta charset="utf-8"><title>角色模型预览</title><style>body{margin:0;background:#dce6e9;font:15px system-ui;color:#244252}header{position:absolute;top:24px;left:32px}h1{margin:0 0 8px;font-size:24px}button{padding:10px 18px;border:0;border-radius:8px;background:#244252;color:white;margin-right:8px;cursor:pointer}#labels{position:absolute;bottom:48px;display:flex;width:100%;justify-content:space-evenly;font-weight:bold}#status{position:absolute;bottom:12px;left:32px;font-size:12px}</style><header><h1>积木角色 · 模型预览</h1><p>蓝青主角 / 绿色步兵 / 红色重装 / 黄色精英</p><button id="lineup">角色阵列</button><button id="body">第一人称低头</button></header><div id="labels"><span>PLAYER</span><span>INFANTRY</span><span>HEAVY</span><span>ELITE</span></div><div id="status">正在验证…</div><script type="module">
import * as THREE from 'three';
import {BlockCharacterModel} from '/src/core/BlockCharacterModel.ts';
import {PlayerModel} from '/src/player/PlayerModel.ts';
import {EnemyBase} from '/src/enemies/EnemyBase.ts';
import {getEnemyDefinition} from '/src/enemies/EnemyTypes.ts';
import {EventBus} from '/src/core/EventBus.ts';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdce6e9);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x819795,2.5));const sun=new THREE.DirectionalLight(0xfff3dc,3);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xcbd9da,roughness:0.85}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.01;ground.receiveShadow=true;scene.add(ground);
const hero=new BlockCharacterModel('player');hero.group.position.x=-2.7;scene.add(hero.group);
const enemies=['normal','heavy','elite'].map((type,i)=>{const e=new EnemyBase(scene,type,getEnemyDefinition(type),new THREE.Vector3(-0.9+i*1.8,0,0));e.update(1,camera.position);return e;});
const player=new PlayerModel(scene);const playerGroup=scene.children.find(x=>x.userData.raycastIgnore && x.name==='player_block_character');playerGroup.visible=false;
function lineup(){hero.group.visible=true;enemies.forEach(e=>scene.getObjectByName('enemy_'+e.getId()).visible=true);playerGroup.visible=false;camera.fov=36;camera.position.set(3.2,3.2,11.8);camera.lookAt(0,1,0);camera.updateProjectionMatrix();document.getElementById('labels').style.display='flex';}
function body(){hero.group.visible=false;enemies.forEach(e=>scene.getObjectByName('enemy_'+e.getId()).visible=false);playerGroup.visible=true;camera.fov=75;camera.position.set(0,1.6,0);camera.lookAt(0,0,-0.3);camera.updateProjectionMatrix();EventBus.getInstance().emit('player:transformChanged',{position:camera.position.clone(),forward:camera.getWorldDirection(new THREE.Vector3())});player.update(1/60);document.getElementById('labels').style.display='none';}
document.getElementById('lineup').onclick=lineup;document.getElementById('body').onclick=body;
const checks=[];function check(condition,label){if(!condition)throw Error(label);checks.push(label);}
scene.updateMatrixWorld(true);
for(const e of enemies){const root=scene.getObjectByName('enemy_'+e.getId());const meshes=[];root.traverse(o=>{if(o.isMesh&&o.userData.enemyId)meshes.push(o)});check(meshes.length>30,e.getId()+' tagged');const x=e.getPosition().x;const scale=e.getDefinition().scale;for(const [y,zone] of [[1.75,'head'],[1.38,e.getId()==='heavy'?'armor':'body']]){const ray=new THREE.Raycaster(new THREE.Vector3(x,y*scale,5),new THREE.Vector3(0,0,-1));const hits=ray.intersectObjects(meshes,false);check(hits[0]?.object.userData.enemyHitZone===zone,e.getId()+' '+zone);}}
const temporary=new BlockCharacterModel('normal');let disposed=0;temporary.group.traverse(o=>{if(o.isMesh)o.geometry.addEventListener('dispose',()=>disposed++)});temporary.dispose();check(disposed>30,'geometry cleanup');
check(playerGroup.userData.raycastIgnore===true,'player raycast exclusion');
document.getElementById('status').textContent=checks.length+' checks passed · hit zones / disposal / player raycast exclusion';
lineup();renderer.setAnimationLoop(()=>{enemies.forEach(e=>e.update(0,camera.position));renderer.render(scene,camera)});window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></html>
