<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Courier New', monospace;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 24px;
        text-shadow: 0 0 4px rgba(0,0,0,0.8);
      }

      #start-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 100;
        pointer-events: auto;
      }

      #start-screen h1 {
        color: #e0e0e0;
        font-size: 48px;
        margin-bottom: 20px;
        letter-spacing: 4px;
      }

      #start-screen p {
        color: #888;
        font-size: 16px;
        margin-bottom: 40px;
      }

      #start-btn {
        padding: 12px 48px;
        font-size: 20px;
        font-family: 'Courier New', monospace;
        background: #333;
        color: #e0e0e0;
        border: 2px solid #666;
        cursor: pointer;
        letter-spacing: 2px;
        transition: all 0.2s;
      }

      #start-btn:hover {
        background: #555;
        border-color: #aaa;
      }

      #pause-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        z-index: 90;
        pointer-events: auto;
        cursor: pointer;
      }

      #pause-screen p {
        color: #ccc;
        font-size: 24px;
        letter-spacing: 2px;
      }

      #pause-screen .hint {
        color: #666;
        font-size: 14px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div id="crosshair">+</div>
    </div>
    <div id="start-screen">
      <h1>FPS GAME</h1>
      <p>Click to start</p>
      <button id="start-btn">PLAY</button>
    </div>
    <div id="pause-screen">
      <p>PAUSED</p>
      <p class="hint">Click to resume</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
